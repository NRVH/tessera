<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- La ventana de agente: solo la terminal del agente. La misma política que index.html
         sin lo que solo usan el editor y los visores (workers, iframes, audio y vídeo):
         style-src 'unsafe-inline' para xterm.js y los estilos inline de React, img-src
         data: y blob: para las miniaturas de lo pegado. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tessera</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/agente.tsx"></script>
  </body>
</html>
