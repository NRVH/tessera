name: Reportar un error
description: Algo de Tessera no funciona como esperabas.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por tomarte el tiempo de reportar un problema.
        You can also write in English.
        **Los problemas de seguridad no se reportan aquí**: consulta [SECURITY.md](https://github.com/NRVH/tessera/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Versión de Tessera
      description: "La enseña Configuración › Acerca de (por ejemplo, 0.71.0)."
      placeholder: "0.71.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options:
        - Windows 11
        - macOS (Apple Silicon)
        - Otro
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: Versión del sistema
      description: "Por ejemplo: Windows 11 24H2, macOS 15.3."
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Modo del proyecto
      description: Dónde corre el proyecto afectado, si importa.
      options:
        - Docker (sandbox)
        - Nativo
        - No tiene que ver con un proyecto
        - No lo sé
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Versión de Docker Desktop
      description: Solo si el proyecto corre en modo Docker.
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: La secuencia de pasos más corta que hace aparecer el problema.
      placeholder: |
        1. Abre un proyecto en modo Docker
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Qué pasó en su lugar
      description: Incluye los mensajes de error y, si ayuda, capturas de pantalla.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Registros
      description: |
        Las líneas relevantes de la carpeta `logs` dentro de la carpeta de datos de Tessera
        (`%APPDATA%\Tessera\logs` en Windows, `~/Library/Application Support/Tessera/logs` en macOS).
        Revísalas antes y quita rutas, nombres o cualquier cosa que prefieras no compartir.
      render: text
