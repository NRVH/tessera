name: Proponer una mejora
description: Sugiere una idea o una mejora para Tessera.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por la sugerencia.
        You can also write in English.
  - type: textarea
    id: problem
    attributes:
      label: El problema
      description: ¿Qué intentas hacer, y qué te lo impide hoy?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: La propuesta
      description: Cómo te imaginas que funcionaría.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Plataformas
      description: Dónde lo usarías. Tessera trata Windows y macOS por igual, así que dilo si solo tiene sentido en una.
      options:
        - Las dos
        - Solo Windows
        - Solo macOS
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas
      description: Otras formas que has considerado o que usas hoy.
