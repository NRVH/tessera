name: Feature request
description: Suggest an idea or an improvement for Tessera.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. You can write in English or in Spanish.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: How you imagine it working.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      description: Where you would use it. Tessera treats Windows and macOS as equals, so say if it only makes sense on one.
      options:
        - Both
        - Windows only
        - macOS only
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you have considered or use today.
